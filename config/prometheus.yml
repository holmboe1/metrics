global:
  scrape_interval: 15s

scrape_configs:
  # Proxmox PVE exporter
  - job_name: 'proxmox'
    static_configs:
      - targets: ['192.168.10.250:9221']

  # Node exporter på swarm-nodene
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['docker01:9100','docker02:9100','docker03:9100']

  # cAdvisor på swarm-nodene (containere)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['docker01:8080','docker02:8080','docker03:8080']

  # Microceph / Ceph via mgr på docker03
  - job_name: 'ceph'
    static_configs:
      - targets: ['docker03:9283']
